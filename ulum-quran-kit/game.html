<title>مغامرة علوم القرآن</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Tajawal:wght@500;700;800;900&display=swap">
<style>
/* Layout: one-screen arcade console. A night-sky board with a winding path of 10 stations, then full-screen rounds. Single dark look by design. */
:root{
  --sky:#0F0C2E; --sky2:#1C1250; --panel:rgba(255,255,255,.07); --line:rgba(255,255,255,.16);
  --ink:#F4F1FF; --mute:#B8B2DA; --gold:#FFC83D; --mint:#34D399; --rose:#FF5D73; --sea:#38BDF8;
  --display:"El Messiri","Tajawal",system-ui,sans-serif; --body:"Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,#3B1D7A55,transparent),linear-gradient(180deg,var(--sky),var(--sky2));background-color:var(--sky);color:var(--ink);font-family:var(--body);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;direction:rtl;overflow-x:hidden}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:calc(100% - 24px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-size:1.25rem;font-weight:700;color:var(--gold)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:800}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,8vw,3rem);margin:6px 0 0;text-wrap:balance;line-height:1.15}
.lead{color:var(--mute);margin:0;line-height:1.7}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:right;display:flex;flex-direction:column;gap:6px;min-height:110px;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--gold)}
.mode b{font-size:1.15rem}
.mode span{color:var(--mute);font-size:.92rem;line-height:1.5}
.mode.hero{grid-column:1/-1;background:linear-gradient(135deg,#FFC83D22,#F472B622);border-color:#FFC83D66}
.mode.hero b{font-family:var(--display);font-size:1.5rem;color:var(--gold)}
/* map */
.map{position:relative;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.station{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 14px;text-align:right;width:86%}
.station:nth-child(odd){align-self:flex-start}
.station:nth-child(even){align-self:flex-end}
.station .num{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.2rem;color:#14102E}
.station .txt{flex:1;min-width:0}
.station .txt b{display:block;font-size:1.05rem}
.station .txt small{color:var(--mute)}
.stars{letter-spacing:2px;color:#555077;font-size:1.1rem;white-space:nowrap}
.stars i{font-style:normal;color:var(--gold)}
.tag{display:inline-block;font-size:.75rem;font-weight:900;background:var(--gold);color:#14102E;border-radius:6px;padding:1px 6px;margin-inline-start:6px;vertical-align:middle}
/* play */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hearts{font-size:1.3rem;letter-spacing:2px}
.timer{height:10px;background:var(--panel);border-radius:6px;overflow:hidden}
.timer>i{display:block;height:100%;background:var(--mint);transform-origin:right;transition:background .3s}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 18px;display:flex;flex-direction:column;gap:6px}
.qcat{color:var(--gold);font-weight:800;font-size:.9rem}
.qtext{font-size:1.4rem;font-weight:800;line-height:1.55;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:1.1rem;font-weight:700;transition:transform .1s,background .2s,border-color .2s}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#14102E;display:grid;place-items:center;font-weight:900}
.opt.ok{background:#16A34A;border-color:#86EFAC}
.opt.ok .k{background:#fff}
.opt.bad{background:#7F1D2D;border-color:var(--rose);animation:shake .35s}
.opt.dim{opacity:.4}
.opt:disabled{cursor:default}
.note{color:var(--mint);font-weight:700;min-height:1.6em;line-height:1.6}
.combo{font-weight:900;color:var(--gold)}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.big{font-family:var(--display);font-size:clamp(2.2rem,10vw,3.4rem);font-weight:700;color:var(--gold);text-align:center;animation:pop .5s}
.result{display:flex;flex-direction:column;gap:12px;text-align:center}
.result .stars{font-size:2.6rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--gold);color:#14102E;font-weight:900;border-radius:14px;padding:12px 18px;font-size:1.05rem}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.wrong{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:right;line-height:1.6}
.wrong b{color:var(--mint)}
/* match */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cardm{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 10px;min-height:64px;font-weight:800;line-height:1.4;transition:all .2s}
.cardm.book{border-color:#A78BFA88}
.cardm.auth{border-color:#38BDF888;color:#BDE8FF}
.cardm.sel{border-color:var(--gold);background:#FFC83D22;transform:scale(1.03)}
.cardm.gone{opacity:0;transform:scale(.8);pointer-events:none}
.cardm.bad{border-color:var(--rose);animation:shake .35s}
.colh{color:var(--mute);font-weight:800;text-align:center;font-size:.9rem}
/* swipe */
.sura{font-family:var(--display);font-size:clamp(2.4rem,12vw,3.6rem);text-align:center;font-weight:700;padding:30px 0;animation:pop .3s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .btn{font-size:1.4rem;padding:22px 10px}
.btn.sea{background:var(--sea)}
.inp{flex:1;min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);font:inherit;font-size:1.1rem}
.inp:focus{outline:none;border-color:var(--gold)}
.me{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.me b{font-size:1.2rem}.me small{display:block;color:var(--mute)}
.herorow{display:flex;align-items:center;gap:14px;justify-content:space-between}.herorow>div:first-child{display:flex;flex-direction:column;gap:6px;min-width:0}
.ring{flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-content:center;text-align:center;background:radial-gradient(closest-side,var(--sky2) 78%,transparent 79%),conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.12) 0)}
.ring b{font-size:1.3rem;color:var(--ink)}.ring small{color:var(--mute);font-size:.8rem}
.explain{background:#2A1036;border:2px solid var(--rose);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;animation:pop .35s}
.explain .ans{font-family:var(--display);font-size:1.7rem;color:var(--mint);font-weight:700;line-height:1.4}
.qcard.again{border-color:var(--rose)}
.lbrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.lbrow.me{border-color:var(--gold);background:#FFC83D1A}
.lbpos{flex:none;width:34px;text-align:center;font-weight:900;font-size:1.2rem}
.lbname{flex:1;min-width:0;font-weight:800}.lbname small{display:block;color:var(--mute);font-weight:500}
.lbxp{font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a,n,ex){return shuffle(a.filter(function(v){return ex.indexOf(v)<0})).slice(0,n)}

/* ---------- question pools ---------- */
function mk(c,q,a,o,n,fixed){return{c:c,q:q,a:a,o:fixed?o:shuffle(o),n:n||""}}
function pool(cat){
  var out=MCQ.filter(function(m){return m[0]===cat}).map(function(m){return mk(m[0],m[1],m[2],[m[2],m[3],m[4],m[5]],m[6])});
  if(cat==="الكتب"){
    BOOKS.forEach(function(b){out.push(mk(cat,"مَن مؤلّف «"+b[0]+"»؟",b[1],[b[1]].concat(pick(AUTHORS,3,[b[1]]))))});
    AUTHORS.forEach(function(a){var own=BOOKS.filter(function(b){return b[1]===a}).map(function(b){return b[0]});
      out.push(mk(cat,"أيّ هذه الكتب من تأليف "+a+"؟",own[0],[own[0]].concat(pick(TITLES,3,own))))});
  }
  if(cat==="المكي والمدني"){
    shuffle(MADANI).slice(0,8).forEach(function(s){out.push(mk(cat,"سورة "+s+":","مدنية",["مكية","مدنية"],"من العشرين المدنية",true))});
    shuffle(MAKKI).slice(0,8).forEach(function(s){out.push(mk(cat,"سورة "+s+":","مكية",["مكية","مدنية"],"ليست من العشرين المدنية",true))});
  }
  if(cat==="الأحرف والقراءات"){
    var pairs=QURRA.map(function(q){return q[1]});
    QURRA.forEach(function(q){out.push(mk(cat,"مَن راويا "+q[0]+"؟",q[1],[q[1]].concat(pick(pairs,3,[q[1]]))))});
    RAWI.forEach(function(r){out.push(mk(cat,"الراوي «"+r[0]+"» يروي عن:",r[1],[r[1]].concat(pick(IMAMS,3,[r[1]]))))});
  }
  return out;
}

/* ---------- player, ranks, mastery ---------- */
SAVE.box=SAVE.box||{};SAVE.seen=SAVE.seen||{};SAVE.name=SAVE.name||"";SAVE.pid=SAVE.pid||("p"+Math.random().toString(36).slice(2,10));persist();
var RANKS=[[0,"مبتدئ"],[300,"طالب علم"],[800,"حافظ"],[1500,"متقن"],[2500,"علّامة"],[4000,"سيوطي العصر 👑"]];
function rank(xp){var r=RANKS[0],n=null;for(var i=0;i<RANKS.length;i++){if(xp>=RANKS[i][0])r=RANKS[i];else{n=RANKS[i];break}}return{name:r[1],from:r[0],next:n}}
function key(q){return q.q+"|"+q.a}
function mastered(q){return (SAVE.box[key(q)]||0)>=2}
function examPool(){
  var nz=pool("التعريف والنزول").filter(function(q){return /نزل|نزول|مدة|المدثر|عائشة|التنزلات|بيت العزة|أنزل|أسماء/.test(q.q)});
  return pool("الكتب").concat(pool("القرآن والحديث"),pool("ترجمة القرآن"),nz);
}
function uniqQ(a){var s={};return a.filter(function(q){var k=key(q);if(s[k])return false;s[k]=1;return true})}
function masteryOf(list){list=uniqQ(list);var m=list.filter(mastered).length;return{m:m,n:list.length}}
function weakList(){var all=examPool();LEVELS.forEach(function(L){all=all.concat(pool(L.c))});all=uniqQ(all);return all.filter(function(q){return SAVE.seen[key(q)]&&!mastered(q)})}

    h("button",{class:"mode",on:{click:function(){play({boss:true})}}},[h("b",{},["الوحش الأخير"]),h("span",{},["20 سؤالًا من كل شيء، 8 ثوانٍ"])])

/* a round: a wrong answer comes back again and again until it is answered right twice */
function pickRound(list,n){
  list=uniqQ(list);
  var weak=shuffle(list.filter(function(q){return SAVE.seen[key(q)]&&!mastered(q)})),fresh=shuffle(list.filter(function(q){return !SAVE.seen[key(q)]})),done=shuffle(list.filter(mastered));
  return weak.concat(fresh,done).slice(0,n);
}
function play(opt){
  var qs,label,secs=20;
  if(opt.boss){var all=[];LEVELS.forEach(function(L){all=all.concat(shuffle(pool(L.c)).slice(0,3))});qs=shuffle(all).slice(0,20);label="الوحش الأخير";secs=8}
  else if(opt.weak){qs=shuffle(weakList()).slice(0,12);label="أخطائي"}
  else if(opt.exam){qs=pickRound(examPool(),12);label="مسار الامتحان"}
  else{qs=pickRound(pool(LEVELS[opt.lvl].c),10);label=LEVELS[opt.lvl].t}
  var queue=qs.map(function(q){return{q:q,need:1,missed:false}}),total=queue.length,cleared=0,score=0,streak=0,firstTry=0,errors=0,missedList=[];
  function next(){
    stopTimer();
    if(!queue.length)return finish();
    var item=queue[0],q=item.q,left=secs,locked=false;
    var opts=q.o.length===2?q.o:shuffle(q.o);
    app.textContent="";app.appendChild(topbar(true));
    var mult=streak>=6?3:streak>=3?2:1;
    app.appendChild(h("div",{class:"hud"},[txt("span","pill",label),txt("span","combo",mult>1?"🔥 ×"+mult:""),txt("span","pill","✔ "+cleared+"/"+total)]));
    app.appendChild(h("div",{class:"timer"},[h("i",{style:"transform:scaleX("+(cleared/total)+");background:var(--mint)"})]));
    var bar=h("i");app.appendChild(h("div",{class:"timer"},[bar]));
    app.appendChild(h("div",{class:"qcard"+(item.missed?" again":"")},[txt("span","qcat",item.missed?"🔁 سؤال عاد إليك · "+q.c:q.c),txt("div","qtext",q.q)]));
    var box=h("div",{class:"opts"}),note=txt("div","note","");
    var K=["أ","ب","ج","د"];
    var btns=opts.map(function(o,k){var b=h("button",{class:"opt",on:{click:function(){answer(o,b)}}},[txt("span","k",K[k]),h("span",{},[o])]);box.appendChild(b);return b});
    app.appendChild(box);app.appendChild(note);
    function answer(o,b){
      if(locked)return;locked=true;stopTimer();
      var good=o===q.a,k=key(q);SAVE.seen[k]=1;
      btns.forEach(function(x,j){x.disabled=true;if(opts[j]===q.a)x.classList.add("ok");else if(x!==b)x.classList.add("dim")});
      queue.shift();
      if(good){
        streak++;var m2=streak>=6?3:streak>=3?2:1,pts=(item.missed?5:10)*m2+Math.max(0,Math.round(left/2));score+=pts;SFX.ok();
        if(streak===3||streak===6||streak===10)confetti(60);
        SAVE.box[k]=(SAVE.box[k]||0)+1;item.need--;
        if(item.need>0){queue.splice(Math.min(queue.length,4),0,item);note.textContent="صحيح! +"+pts+" · سيعود مرة أخيرة للتثبيت"}
        else{cleared++;if(!item.missed)firstTry++;note.textContent=(streak>=3?"🔥 "+streak+" متتالية! ":"صحيح! ")+"+"+pts+(q.n?" · "+q.n:"")}
        SAVE.xp+=pts;persist();setTimeout(next,item.need>0?1300:1000);
      }else{
        streak=0;errors++;SFX.bad();if(b)b.classList.add("bad");SAVE.box[k]=0;persist();
        if(!item.missed)missedList.push(q);item.missed=true;item.need=2;
        queue.splice(Math.min(queue.length,2+Math.floor(Math.random()*2)),0,item);
        var card=h("div",{class:"explain"},[txt("span","qcat",o==null?"انتهى الوقت":"الجواب الصحيح"),txt("div","ans",q.a),q.n?txt("div","lead",q.n):null,
          txt("p","lead","احفظها الآن: سيعود هذا السؤال بعد قليل، ويجب أن تجيبه صحيحًا مرتين."),
          h("button",{class:"btn",on:{click:next}},["حفظتها، كمّل"])]);
        app.appendChild(card);card.scrollIntoView({behavior:REDUCED?"auto":"smooth",block:"center"});
      }
    }
    timerId=setInterval(function(){left-=.1;bar.style.transform="scaleX("+Math.max(0,left/secs)+")";if(left<secs*.3)bar.style.background="var(--rose)";
      if(left<=3&&Math.abs(left-Math.round(left))<.05)SFX.tick();if(left<=0)answer(null,null)},100);
  }
  function finish(){
    stopTimer();pushScore();
    var acc=total?firstTry/total:0;
    SFX.win();confetti(130);
    app.textContent="";app.appendChild(topbar(true));
    var rk=rank(SAVE.xp),em=masteryOf(examPool());
    var r=h("div",{class:"result"},[txt("div","big",acc>=.9?"أسطوري!":acc>=.7?"ممتاز!":"أتقنت الجولة!"),
      txt("p","lead",total+" أسئلة أتقنتها · "+firstTry+" من أول مرة · "+errors+" أخطاء صُحّحت · +"+score+" نقطة"),
      txt("p","lead","رتبتك: "+rk.name+(rk.next?" · بقي "+(rk.next[0]-SAVE.xp)+" نقطة إلى «"+rk.next[1]+"»":"")),
      h("div",{class:"row"},[ring(em.m,em.n)]),txt("p","lead","إتقان مسار الامتحان")]);
    r.appendChild(h("div",{class:"row"},[h("button",{class:"btn",on:{click:function(){play(opt)}}},["جولة أخرى"]),
      h("button",{class:"btn ghost",on:{click:board}},["جدول المتسابقين"]),h("button",{class:"btn ghost",on:{click:home}},["الرئيسية"])]));
    if(missedList.length){r.appendChild(txt("p","lead","هذه أخطأت فيها، راجعها مرة أخيرة:"));missedList.forEach(function(q){r.appendChild(h("div",{class:"wrong"},[q.q+" ",h("b",{},[q.a])]))})}
    app.appendChild(r);
  }
  next();
}

/* ---------- match books ↔ authors ---------- */
var ROUNDS=(function(){var left=shuffle(BOOKS),out=[];while(left.length){var r=[],used=[];left=left.filter(function(b){if(r.length<6&&used.indexOf(b[1])<0){r.push(b);used.push(b[1]);return false}return true});out.push(r)}return out})();
function match(ri){
  stopTimer();app.textContent="";app.appendChild(topbar(true));
  var round=ROUNDS[ri],sel=null,done=0,miss=0,t0=Date.now();
  app.appendChild(h("h1",{},["مطابقة الكتب "+(ri+1)+"/"+ROUNDS.length]));
  app.appendChild(txt("p","lead","اختر كتابًا ثم مؤلّفه. الخطأ يُحسب، والسرعة تهمّ."));
  var g=h("div",{class:"grid"});
  g.appendChild(txt("div","colh","الكتاب"));g.appendChild(txt("div","colh","المؤلّف"));
  var bs=shuffle(round),as=shuffle(round);
  for(var k=0;k<round.length;k++){g.appendChild(card(bs[k],"book"));g.appendChild(card(as[k],"auth"))}
  app.appendChild(g);
  function card(b,kind){
    var c=h("button",{class:"cardm "+kind},[kind==="book"?b[0]:b[1]]);
    c.addEventListener("click",function(){
      if(c.classList.contains("gone"))return;SFX.tap();
      if(!sel||sel.kind===kind){if(sel)sel.el.classList.remove("sel");sel={el:c,kind:kind,b:b};c.classList.add("sel");return}
      if(sel.b[1]===b[1]){sel.el.classList.add("gone");c.classList.add("gone");SFX.ok();done++;sel=null;
        if(done===round.length){var sec=Math.round((Date.now()-t0)/1000),pts=Math.max(10,60-miss*10);SAVE.xp+=pts;persist();confetti(90);SFX.win();
          setTimeout(function(){app.textContent="";app.appendChild(topbar(true));
            var r=h("div",{class:"result"},[txt("div","big","جولة "+(ri+1)+" تمّت"),txt("p","lead",sec+" ثانية · "+miss+" أخطاء · +"+pts+" نقطة")]);
            r.appendChild(h("div",{class:"row"},[ri+1<ROUNDS.length?h("button",{class:"btn",on:{click:function(){match(ri+1)}}},["الجولة التالية"]):h("button",{class:"btn",on:{click:function(){match(0)}}},["من البداية"]),h("button",{class:"btn ghost",on:{click:function(){match(ri)}}},["إعادة"])]));
            round.forEach(function(b){r.appendChild(h("div",{class:"wrong"},[b[0]+" ← ",h("b",{},[b[1]])]))});
            app.appendChild(r)},700)}}
      else{miss++;SFX.bad();var o=sel.el;o.classList.remove("sel");o.classList.add("bad");c.classList.add("bad");setTimeout(function(){o.classList.remove("bad");c.classList.remove("bad")},400);sel=null}
    });
    return c;
  }
}

/* ---------- makki / madani sprint ---------- */

  var deck=shuffle(MADANI.map(function(s){return[s,"مدنية"]}).concat(shuffle(MAKKI.map(function(s){return[s,"مكية"]})).slice(0,30))),i=0,score=0,left=45,missed=[];
  var hud=h("div",{class:"hud"},[txt("span","pill","⏱️ 45"),txt("span","pill","✅ 0")]);app.appendChild(hud);

  app.appendChild(fb);

    hud.lastChild.textContent="✅ "+score;i++;show()}
  show();
  timerId=setInterval(function(){left-=.1;bar.style.transform="scaleX("+Math.max(0,left/45)+")";hud.firstChild.textContent="⏱️ "+Math.ceil(Math.max(0,left));
    if(left<=0){stopTimer();var best=SAVE.best.swipe||0;SAVE.best.swipe=Math.max(best,score);SAVE.xp+=score*5;persist();if(score>best)confetti(100),SFX.win();
      app.textContent="";app.appendChild(topbar(true));
      var r=h("div",{class:"result"},[txt("div","big",score+" إجابة صحيحة"),txt("p","lead",score>best?"رقم قياسي جديد!":"أفضل نتيجة: "+best),
        txt("p","lead","تذكّر: 4 + 2 + 2 + 3 + 8 + 1 = 20 سورة مدنية")]);
      r.appendChild(h("div",{class:"row"},[h("button",{class:"btn",on:{click:swipe}},["مرة أخرى"]),h("button",{class:"btn ghost",on:{click:home}}, ["الرئيسية"])]));
      missed.forEach(function(d){r.appendChild(h("div",{class:"wrong"},["سورة "+d[0]+": ",h("b",{},[d[1]])]))});
      app.appendChild(r)}},100);
}
